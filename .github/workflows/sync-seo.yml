name: تحديث صفحات التعريبات لمحركات البحث

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-translation-seo
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: إنشاء صفحات التعريبات وخريطة الموقع
        run: node scripts/generate-seo-pages.mjs --output .
      - name: حفظ الصفحات الجديدة
        run: |
          git add translations sitemap.xml robots.txt seo-status.json
          if git diff --cached --quiet; then
            echo "لا توجد تغييرات"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update translation search pages"
          git push
